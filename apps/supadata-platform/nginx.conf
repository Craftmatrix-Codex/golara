events {}

http {
  upstream supadata_go {
    server 127.0.0.1:8090;
  }

  upstream supadata_studio {
    server 127.0.0.1:8082;
  }

  server {
    listen 8080;
    server_name _;

    client_max_body_size 100m;

    # Supabase-compatible backend routes.
    location ^~ /auth/v1/ {
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /rest/v1/ {
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /rpc/ {
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /storage/v1/ {
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /functions/v1/ {
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /realtime/v1/ {
      proxy_pass http://supadata_go;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Native Studio's project selector calls /api/supadata/*; keep the
    # browser contract and map it to the Go control-plane namespace.
    location = /api/supadata {
      proxy_pass http://supadata_go/api/projects;
    }
    location ^~ /api/supadata/ {
      rewrite ^/api/supadata/(.*)$ /api/$1 break;
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      proxy_pass http://supadata_go;
    }
    location = /api/projects {
      proxy_pass http://supadata_go;
    }
    location ^~ /api/projects/ {
      proxy_pass http://supadata_go;
    }

    # Native Supabase Studio owns the frontend and its internal /api routes.
    location / {
      proxy_pass http://supadata_studio;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
