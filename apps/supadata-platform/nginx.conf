events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream supadata_go {
    server 127.0.0.1:8090;
  }

  server {
    listen 8080;
    server_name _;

    client_max_body_size 100m;

    # Supabase-compatible backend routes.
    location ^~ /auth/v1/ {
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /graphql/v1 {
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /rest/v1/ {
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /rpc/ {
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /storage/v1/ {
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /functions/v1/ {
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /realtime/v1/ {
      proxy_pass http://supadata_go;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Native Studio's project selector calls /api/supadata/*; keep the
    # browser contract and map it to the Go control-plane namespace.
    location = /api/supadata {
      proxy_pass http://supadata_go/api/projects;
    }
    location ^~ /api/supadata/ {
      rewrite ^/api/supadata/(.*)$ /api/$1 break;
      proxy_pass http://supadata_go;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      proxy_pass http://supadata_go;
    }
    location = /api/projects {
      proxy_pass http://supadata_go;
    }
    location ^~ /api/projects/ {
      proxy_pass http://supadata_go;
    }

    # Laravel serves the React/Vite Studio shell and control-plane API. Its
    # middleware enforces Studio authentication for everything except health.
    root /var/www/studio/public;
    index index.php;

    # Static Studio assets are content-addressed or versioned. Compress them and
    # keep them in the browser cache so repeat navigation does not block on
    # multi-megabyte editor bundles.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
      application/javascript
      application/json
      application/wasm
      image/svg+xml
      text/css
      text/javascript
      text/plain
      application/xml;

    location ^~ /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /monaco-editor/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /img/ {
      try_files $uri =404;
      expires 7d;
      add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
      # Never retain the HTML shell: it references the current hashed bundle.
      # Hashed assets remain immutable in the locations above.
      add_header Cache-Control "no-store" always;
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      try_files $uri =404;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param HTTP_AUTHORIZATION $http_authorization;
      fastcgi_param HTTPS $https if_not_empty;
      fastcgi_pass 127.0.0.1:9000;
    }
  }
}
